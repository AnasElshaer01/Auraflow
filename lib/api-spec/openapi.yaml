openapi: "3.1.0"
info:
  title: Api
  version: "1.0.0"
servers:
  - url: /api

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /keywords:
    get:
      operationId: listKeywords
      summary: List all tracked keywords
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Keyword"
    post:
      operationId: createKeyword
      summary: Create a tracked keyword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeywordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keyword"

  /keywords/{id}:
    delete:
      operationId: deleteKeyword
      summary: Delete a tracked keyword
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /mentions:
    get:
      operationId: listMentions
      summary: List mentions with optional filters
      parameters:
        - name: keywordId
          in: query
          schema:
            type: integer
        - name: sentiment
          in: query
          schema:
            type: string
            enum: [positive, neutral, negative]
        - name: platform
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentionList"

  /mentions/{id}:
    get:
      operationId: getMention
      summary: Get a single mention
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mention"
        "404":
          description: Not found

  /mentions/scan:
    post:
      operationId: triggerScan
      summary: Trigger a Reddit mention scan for all keywords
      responses:
        "200":
          description: Scan triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"

  /alerts:
    get:
      operationId: listAlerts
      summary: List alerts
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /alerts/{id}/read:
    patch:
      operationId: markAlertRead
      summary: Mark an alert as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          description: Not found

  /alerts/read-all:
    patch:
      operationId: markAllAlertsRead
      summary: Mark all alerts as read
      responses:
        "200":
          description: OK

  /summaries:
    get:
      operationId: listSummaries
      summary: List AI daily summaries
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Summary"

  /summaries/generate:
    post:
      operationId: generateSummary
      summary: Generate a new AI daily summary
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      summary: Get aggregated dashboard statistics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/sentiment-trend:
    get:
      operationId: getSentimentTrend
      summary: Get sentiment counts over the last 7 days
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SentimentTrendPoint"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Keyword:
      type: object
      required: [id, text, type, createdAt]
      properties:
        id:
          type: integer
        text:
          type: string
        type:
          type: string
          enum: [brand, competitor, keyword]
        createdAt:
          type: string
          format: date-time

    KeywordInput:
      type: object
      required: [text, type]
      properties:
        text:
          type: string
          minLength: 1
        type:
          type: string
          enum: [brand, competitor, keyword]

    Mention:
      type: object
      required: [id, keywordId, platform, title, url, author, sentiment, upvotes, isUrgent, isComplaint, mentionedAt, createdAt]
      properties:
        id:
          type: integer
        keywordId:
          type: integer
        platform:
          type: string
        title:
          type: string
        body:
          type: ["string", "null"]
        url:
          type: string
        author:
          type: string
        subreddit:
          type: ["string", "null"]
        sentiment:
          type: string
          enum: [positive, neutral, negative]
        sentimentScore:
          type: ["number", "null"]
        upvotes:
          type: integer
        isUrgent:
          type: boolean
        isComplaint:
          type: boolean
        mentionedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    MentionList:
      type: object
      required: [mentions, total]
      properties:
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/Mention"
        total:
          type: integer

    Alert:
      type: object
      required: [id, type, message, isRead, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [negative_mention, high_engagement, competitor_spike]
        mentionId:
          type: ["integer", "null"]
        keywordId:
          type: ["integer", "null"]
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Summary:
      type: object
      required: [id, date, content, topMentions, mainComplaints, trendingDiscussions, sentimentOverview, createdAt]
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        content:
          type: string
        topMentions:
          type: string
        mainComplaints:
          type: string
        trendingDiscussions:
          type: string
        sentimentOverview:
          type: string
        createdAt:
          type: string
          format: date-time

    ScanResult:
      type: object
      required: [scanned, newMentions, newAlerts]
      properties:
        scanned:
          type: integer
        newMentions:
          type: integer
        newAlerts:
          type: integer

    DashboardStats:
      type: object
      required: [totalMentions, positiveMentions, neutralMentions, negativeMentions, urgentMentions, complaintMentions, unreadAlerts, trackedKeywords]
      properties:
        totalMentions:
          type: integer
        positiveMentions:
          type: integer
        neutralMentions:
          type: integer
        negativeMentions:
          type: integer
        urgentMentions:
          type: integer
        complaintMentions:
          type: integer
        unreadAlerts:
          type: integer
        trackedKeywords:
          type: integer

    SentimentTrendPoint:
      type: object
      required: [date, positive, neutral, negative]
      properties:
        date:
          type: string
        positive:
          type: integer
        neutral:
          type: integer
        negative:
          type: integer
